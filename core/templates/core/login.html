{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMOR - Login System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: #1e2125; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            font-family: 'Segoe UI', sans-serif;
        }

        /* LOGO PLN DI KIRI ATAS */
        .top-left-logo {
            position: absolute;
            top: 30px;
            left: 30px;
            height: 50px;
            z-index: 10;
        }

        /* LOGO BACKGROUND - DITERANGKAN */
        body::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 130%; 
            height: 130%;
            background: url("{% static 'images/logo_armor.png' %}") no-repeat center center;
            background-size: contain;
            opacity: 0.8; /* Lebih terang sesuai permintaan */
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-header h1 {
            color: white;
            font-weight: 800;
            letter-spacing: 15px;
            margin-bottom: 60px;
            text-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        /* TEKNIK ANTI-KOTAK PUTIH */
        .form-group {
            margin-bottom: 45px;
            position: relative;
            background: transparent !important;
        }

        /* Kita ganti class agar tidak terkena gaya default Bootstrap */
        .input-ghost { 
            background: none !important;
            background-color: transparent !important;
            border: none !important;
            border-bottom: 2px solid rgba(255, 255, 255, 0.6) !important;
            border-radius: 0 !important;
            color: white !important;
            width: 100%;
            padding: 10px 0 10px 40px;
            font-size: 1.2rem;
            outline: none !important;
            box-shadow: none !important;
            transition: 0.3s;
        }

        .input-ghost:focus {
            border-bottom: 2px solid #FFD100 !important;
        }

        /* MENGHANCURKAN AUTOFILL BROWSER (Penyebab utama kotak putih muncul lagi) */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus,
        input:-internal-autofill-selected {
            -webkit-text-fill-color: white !important;
            -webkit-box-shadow: 0 0 0px 1000px inset transparent !important;
            background-color: transparent !important;
            fill: transparent !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }

        .form-icon {
            position: absolute;
            left: 0;
            top: 12px;
            color: white;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* TOMBOL SIGN IN TRANSPARAN */
        .btn-ghost { 
            background: transparent !important;
            color: white !important; 
            font-weight: 700; 
            border: 2px solid #0059A3 !important; 
            border-radius: 0; /* Kotak minimalis */
            padding: 12px;
            width: 100%;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            transition: 0.3s;
        }
        
        .btn-ghost:hover { 
            border-color: #FFD100 !important;
            color: #FFD100 !important;
            background: rgba(255, 255, 255, 0.05) !important;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.5);
            margin-top: 60px;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <img src="{% static 'images/logo_pln.png' %}" class="top-left-logo" alt="PLN">

    <div class="login-wrapper">
        <div class="login-header">
            <h1>LOGIN</h1>
        </div>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <span class="form-icon">👤</span>
                <input type="text" name="username" class="input-ghost" placeholder="USERNAME" autocomplete="new-password" required>
            </div>
            
            <div class="form-group">
                <span class="form-icon">🔒</span>
                <input type="password" name="password" id="passwordField" class="input-ghost" placeholder="PASSWORD" autocomplete="new-password" required style="padding-right:40px;">
                <span id="togglePassword" style="position:absolute; right:8px; top:10px; cursor:pointer; color:white; opacity:0.85; user-select:none; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.85'"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>

            <button type="submit" class="btn btn-ghost">
                SIGN IN
            </button>
            
            <div style="margin-top: 25px; text-align: center;">
                <small style="color: rgba(255,255,255,0.6); font-size: 0.8rem;">
                    Lupa password? Hubungi Admin
                </small>
            </div>
            
            <div class="footer-text">
                ARMOR SECURITY SYSTEM
            </div>
        </form>
    </div>


<script>
(function() {
    const toggle = document.getElementById('togglePassword');
    const field = document.getElementById('passwordField');
    if (toggle && field) {
        const SVG_ON = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const SVG_OFF = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;
        toggle.addEventListener('click', function() {
            if (field.type === 'password') {
                field.type = 'text';
                toggle.innerHTML = SVG_OFF;
            } else {
                field.type = 'password';
                toggle.innerHTML = SVG_ON;
            }
        });
    }
})();
</script>
</body>
</html>
